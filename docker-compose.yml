services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  db-setup:
    image: postgres:18.6-alpine
    user: postgres
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MIGRATION_USER: ${MIGRATION_USER:?MIGRATION_USER is required}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?MIGRATION_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ./docker/postgres:/postgres:ro
    entrypoint: [/bin/sh, /postgres/setup.sh]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrate
    environment:
      PGHOST: postgres
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=5432 sslmode=disable
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${MIGRATION_USER:?MIGRATION_USER is required}
      PGPASSWORD: ${MIGRATION_PASSWORD:?MIGRATION_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
    command:
      - goose -dir /migrations up && psql -X -v ON_ERROR_STOP=1 -f /postgres/grants.sql
    depends_on:
      db-setup:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: app
    environment:
      APP_HTTP_ADDR: 0.0.0.0:8080
      APP_CONFIG_PATH:
      APP_HTTP_READ_HEADER_TIMEOUT:
      APP_HTTP_READ_TIMEOUT:
      APP_HTTP_WRITE_TIMEOUT:
      APP_HTTP_IDLE_TIMEOUT:
      APP_HTTP_SHUTDOWN_TIMEOUT:
      APP_HTTP_MAX_HEADER_BYTES:
      APP_POSTGRES_MAX_CONNS:
      APP_POSTGRES_MIN_CONNS:
      APP_POSTGRES_CONNECT_TIMEOUT:
      APP_POSTGRES_STATEMENT_TIMEOUT:
      APP_POSTGRES_LOCK_TIMEOUT:
      APP_LOGGING_LEVEL:
      APP_LOGGING_FORMAT:
      APP_LIMITS_REQUEST_TIMEOUT:
      APP_LIMITS_MAX_REQUEST_BYTES:
      APP_LIMITS_MAX_RESPONSE_BYTES:
      APP_LIMITS_MAX_RESULT_NODES:
      APP_LIMITS_MAX_CONCURRENT_REQUESTS:
      APP_DATABASE_URL: host=postgres port=5432 sslmode=disable
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${APP_DB_USER:?APP_DB_USER is required}
      PGPASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s

volumes:
  postgres_data:
